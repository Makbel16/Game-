<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Runner Game</h1>
            <div class="score">Score: <span id="score">0</span></div>
            <div class="speed">Speed: <span id="speed">1x</span></div>
        </div>
        <div class="game-area">
            <div class="runner" id="runner">
                <svg class="runner-svg" viewBox="0 0 60 90" width="60" height="90">
                    <g class="runner-body">
                        <!-- Head -->
                        <circle cx="30" cy="20" r="8" fill="#FFD700" />
                        
                        <!-- Body (slightly tilted forward for running pose) -->
                        <rect x="25" y="28" width="10" height="32" fill="#4682B4" />
                        
                        <!-- Left Arm Group (bent for running) -->
                        <g class="left-arm">
                            <line x1="30" y1="32" x2="18" y2="42" stroke="#FFD700" stroke-width="4" />
                            <line x1="18" y1="42" x2="12" y2="50" stroke="#FFD700" stroke-width="3" class="left-hand" />
                            <!-- Fingers on left hand -->
                            <line x1="12" y1="50" x2="9" y2="52" stroke="#FFD700" stroke-width="1.5" />
                            <line x1="12" y1="50" x2="12" y2="53" stroke="#FFD700" stroke-width="1.5" />
                            <line x1="12" y1="50" x2="15" y2="52" stroke="#FFD700" stroke-width="1.5" />
                        </g>
                        
                        <!-- Right Arm Group (bent for running) -->
                        <g class="right-arm">
                            <line x1="30" y1="32" x2="42" y2="42" stroke="#FFD700" stroke-width="4" />
                            <line x1="42" y1="42" x2="48" y2="50" stroke="#FFD700" stroke-width="3" class="right-hand" />
                            <!-- Fingers on right hand -->
                            <line x1="48" y1="50" x2="45" y2="52" stroke="#FFD700" stroke-width="1.5" />
                            <line x1="48" y1="50" x2="48" y2="53" stroke="#FFD700" stroke-width="1.5" />
                            <line x1="48" y1="50" x2="51" y2="52" stroke="#FFD700" stroke-width="1.5" />
                        </g>
                        
                        <!-- Left Leg Group (in running position) -->
                        <g class="left-leg">
                            <line x1="27" y1="60" x2="22" y2="75" stroke="#4169E1" stroke-width="5" />
                            <line x1="22" y1="75" x2="20" y2="85" stroke="#4169E1" stroke-width="4" />
                            <rect x="18" y="85" width="6" height="3" fill="#333" class="left-shoe" />
                        </g>
                        
                        <!-- Right Leg Group (in running position) -->
                        <g class="right-leg">
                            <line x1="33" y1="60" x2="38" y2="75" stroke="#4169E1" stroke-width="5" />
                            <line x1="38" y1="75" x2="40" y2="85" stroke="#4169E1" stroke-width="4" />
                            <rect x="37" y="85" width="6" height="3" fill="#333" class="right-shoe" />
                        </g>
                    </g>
                </svg>
            </div>
            <div class="ground"></div>
            <div class="obstacle" id="obstacle"></div>
        </div>
        <div class="instructions">
            <p>Click or press SPACE to jump over obstacles!</p>
        </div>
        <div class="controls">
            <button id="start-btn">Start Game</button>
            <button id="jump-btn">JUMP!</button>
        </div>
        <div class="developer-info">
            <p>Developed by: Makbel Kebede</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
